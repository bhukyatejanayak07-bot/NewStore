<head>

    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;/*doesn't consider margin padding*/

        }
        nav{
            background-color: #1f1f21;
            /*every thing is touching of the boders of font*/
          
            padding: p20x 50px;
            display: flex;/*arrange side by side*/

        }
        h2{
            color:white;
        }
       .menu{
       display: flex;

    }
    a{
        color: whitesmoke;
        text-decoration: none;/* it removes underline*/

    }
    a:hover{
        color: rgb(255, 221, 0);

        transition: 0.5s;;

    }
    </style>
</head>

    <nav>
