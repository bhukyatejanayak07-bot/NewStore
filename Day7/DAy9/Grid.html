<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product{
            display: grid;
            /* grid-template-columns: 100px 100px 100px; */
            /* use of this is to arrange the no.of rows/coloumn*/
            /* grid-template-columns: 1fr 1fr 1fr; */
            /*portion of available space in grid container*/
            /*it occupies all the screen on top*/
            /* grid-template-columns:repeat(6,150px);6 coulums 150 px size each column */
            /* if you wan to take entire space */
            grid-template-columns: repeat(6,1fr);/*it exactly fix in page*/
            gap:20px;
    

         
        }
        .box{
            background-color: brown;
            text-align: center;
            color:white;
            border:1px solid black;/*border line*/
            border-radius: 10px;
            box-shadow: 10px 10px 20px yellowgreen;
           
            
        }
    </style>
</head>
<body>
    <div class="product">
        <div class="box">Product 1</div>
         <div class="box">Product 2</div>
          <div class="box">Product 3</div>
           <div class="box">Product 4</div>
            <div class="box">Product 5</div>
             <div class="box">Product 6</div>
    </div>
</body>
</html>
