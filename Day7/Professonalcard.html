<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      .home{
            background-color: rgb(245, 14, 14);
            text-align: center;
            width: 320px;
            height: fit-content;
           border:1px solid gray;
           border-radius:10px ;
           /* box-sizing: content-home; */
           padding: 20px;
           margin: 20px;
        }
        div:hover{
            background-color: pink;
            transition: 1s;
            padding:30px;
            border-color: rgb(115, 0, 255);

        }
        button:hover{
          color: yellowgreen;
        }
        h2:hover{
            color:white;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="home">
        <h2>Web Development</h2>
        <p>Learn HTML CSS Javascript</p>
        <button>
            Enroll
        </button>
    </div>
</body>
</html>
