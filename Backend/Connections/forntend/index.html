<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Login Form</h1>
    <form id="LoginForm">

Name : <input type="text" placeholder="abc" id="name">
e-Mail : <input type="text" placeholder="abc@gmail.com" id="email"><br><br>
<button type="submit">Submit/Login</button>
    </form>
   <p id="res"></p>
   <script>
document.getElementById("LoginForm").addEventListener('submit',function(event){

name=document.getElementById("name").value
email=document.getElementById("email").value


//connection frontend and backend

fetch(`http://localhost:3000/login`,{
    method:`POST`,
    headers:{
       'Content-Type':'application/json'
    },
    body: JSON.stringify({name,email})
})

.then(response=>response.json())
.then(data=>document.getElementById('res').textContent=data.message)
.catch(error=>console.error(`Error`,error))


})
   </script>
</body>
</html>
